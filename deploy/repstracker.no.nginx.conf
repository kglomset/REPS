# Host nginx reverse proxy for repstracker.no
# Place at /etc/nginx/sites-available/repstracker.no and symlink into
# sites-enabled, then: nginx -t && systemctl reload nginx
#
# Assumes the REPS containers publish to the host (per docker-compose.yml):
#   frontend -> 127.0.0.1:3000   backend -> 127.0.0.1:8080  (Spring context-path /api)
# Adjust the cert paths to match what your renewal script writes.

# HTTP -> HTTPS (and ACME challenge if your renewer uses the webroot method)
server {
    listen 80;
    listen [::]:80;
    server_name repstracker.no www.repstracker.no;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://repstracker.no$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name repstracker.no;

    ssl_certificate     /etc/letsencrypt/live/repstracker.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repstracker.no/privkey.pem;

    # Backend API — no trailing URI on proxy_pass, so the /api prefix is kept
    # and reaches Spring's context-path unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> Expo web (frontend container)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.repstracker.no;

    ssl_certificate     /etc/letsencrypt/live/repstracker.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repstracker.no/privkey.pem;

    return 301 https://repstracker.no$request_uri;
}
