# Host nginx reverse proxy for repstracker.no
# Place at /etc/nginx/sites-available/repstracker.no, symlink into sites-enabled,
# then: nginx -t && systemctl reload nginx
#
# Containers publish to the host (per docker-compose.yml):
#   frontend -> 127.0.0.1:3000   backend -> 127.0.0.1:8080  (Spring context-path /api)


# HTTP: serve the ACME challenge, redirect everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name repstracker.no www.repstracker.no;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://repstracker.no$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name repstracker.no;

    ssl_certificate     /etc/letsencrypt/live/repstracker.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repstracker.no/privkey.pem;

    # Backend API — no trailing URI on proxy_pass keeps the /api prefix intact
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> Expo web (frontend container)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.repstracker.no;

    ssl_certificate     /etc/letsencrypt/live/repstracker.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repstracker.no/privkey.pem;

    return 301 https://repstracker.no$request_uri;
}
