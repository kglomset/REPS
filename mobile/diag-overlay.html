<script>
(function() {
  // Immediate, synchronous canary: if this never becomes visible when
  // opening the installed WebAPK, no JS in this document executed at all
  // (rules out an app bug entirely, points at Chrome/Android's WebAPK load path).
  try {
    document.title = 'REPS-DIAG-v2';
    document.documentElement.style.background = '#ff6a00';
  } catch (e) {}
  var overlay = null;
  var errors = [];
  function ensureOverlay() {
    if (overlay) return overlay;
    overlay = document.createElement('div');
    overlay.id = '__reps_diag_overlay';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#1a1a1a;color:#f5f5f5;font-family:monospace;font-size:13px;line-height:1.5;padding:16px;overflow:auto;white-space:pre-wrap;';
    document.documentElement.appendChild(overlay);
    return overlay;
  }
  function render() {
    var el = ensureOverlay();
    var lines = ['REPS diagnostic overlay', 'Time: ' + new Date().toISOString(), 'URL: ' + location.href, 'UA: ' + navigator.userAgent, ''];
    if (errors.length === 0) {
      lines.push('No JS errors were captured, but the app did not render anything within 8s.');
    } else {
      lines.push('Captured ' + errors.length + ' error(s):');
      errors.forEach(function(e, i) { lines.push((i + 1) + '. ' + e); });
    }
    lines.push('');
    lines.push('Tap anywhere to force-reload (bypasses cache).');
    el.textContent = lines.join('\n');
    el.onclick = function() {
      if (window.location.reload) {
        window.location.href = window.location.href.split('#')[0] + (window.location.search ? '&' : '?') + '_r=' + Date.now();
      }
    };
  }
  window.addEventListener('error', function(e) {
    var msg;
    if (e.target && e.target !== window && (e.target.src || e.target.href)) {
      msg = 'Resource failed to load: ' + (e.target.src || e.target.href);
    } else {
      msg = (e.message || 'Unknown error') + (e.filename ? ' at ' + e.filename + ':' + e.lineno : '');
    }
    errors.push(msg);
    render();
  }, true);
  window.addEventListener('unhandledrejection', function(e) {
    var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
    errors.push('Unhandled promise rejection: ' + reason);
    render();
  });
  setTimeout(function() {
    var bodyHasContent = document.body && document.body.textContent && document.body.textContent.trim().length > 0;
    var bodyHasVisuals = document.body && document.body.querySelector('img, svg, canvas, input, button, [data-testid]');
    if (!bodyHasContent && !bodyHasVisuals) {
      render();
    }
  }, 4000);
})();
</script>
