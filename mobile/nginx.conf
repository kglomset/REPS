server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PWA manifest — nginx's default mime.types lacks .webmanifest, so set the
    # correct content type explicitly for reliable installability.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # index.html must NEVER be cached. It's the only file that references
    # this build's content-hashed JS/CSS filenames (under /_expo/static/...),
    # and a fresh deploy's image never contains the previous build's hashed
    # files at all (each Docker build produces a brand new dist/ from
    # scratch) — the static-asset location below has no SPA fallback, so a
    # request for a filename that no longer exists gets a plain 404, not
    # index.html. Without this, nginx's default response headers for
    # index.html (Last-Modified/ETag, no explicit Cache-Control) let the
    # browser's heuristic cache hang onto a stale copy for a while after a
    # redeploy — and an installed Android PWA (a WebAPK) refreshes its
    # cached start page far less eagerly than a tab the user might reload or
    # hard-refresh, so it's the one most likely to still be holding a stale
    # index.html pointing at deleted JS chunks. That 404 on every JS chunk
    # is exactly "blank, completely non-responsive page" — no app code ever
    # loads. This was the long-open "PWA blank page on Android install" bug.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # SPA fallback — all unknown paths serve index.html so Expo Router handles
    # routing. Needs the same no-cache headers as /index.html above, since
    # this is how a bare "/" (the manifest's start_url, and what an installed
    # PWA actually requests on launch) ends up serving that same file.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively — safe only because Expo's web export
    # content-hashes every JS/CSS filename, so a new deploy never reuses an
    # old filename for different content; a changed file always gets a new
    # name instead.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
