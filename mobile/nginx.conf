server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PWA manifest — nginx's default mime.types lacks .webmanifest, so set the
    # correct content type explicitly for reliable installability.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # SPA fallback — all unknown paths serve index.html so Expo Router handles routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
