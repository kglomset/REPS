services:
  postgres:
    image: postgres:16-alpine
    container_name: reps-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reps}
      POSTGRES_USER: ${POSTGRES_USER:-reps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reps_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reps}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: reps-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reps}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-reps}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-reps_secret}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-256-bit-key}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./mobile
      dockerfile: Dockerfile.web
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8080/api}
    container_name: reps-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
